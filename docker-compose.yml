services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: tracenixa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tracenixa}
      POSTGRES_USER: ${DB_USER:-tracenixa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tracenixa_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracenixa -d tracenixa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Apache Kafka in KRaft Mode (No ZooKeeper dependency required)
  kafka:
    image: bitnami/kafka:3.7-debian-12
    container_name: tracenixa-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_KRAFT_CLUSTER_ID=TracenixaClusterId0123
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD", "/opt/bitnami/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 3. Tracenixa Java Backend Platform
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracenixa-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tracenixa}
      DB_USER: ${DB_USER:-tracenixa}
      DB_PASSWORD: ${DB_PASSWORD:-tracenixa_secret_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USE_KAFKA: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 4. Tracenixa React TypeScript Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracenixa-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

  # 5. OpenTelemetry Collector (Forwarder to Tracenixa OTLP)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: tracenixa-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      - backend

volumes:
  pgdata:
  kafkadata:
