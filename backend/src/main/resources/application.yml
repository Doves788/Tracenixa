server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tracenixa-platform
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:tracenixadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: tracenixa-workers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

tracenixa:
  jwt:
    secret: "tracenixa-platform-super-secure-production-ready-jwt-secret-key-32bytes-min!"
    expiration-ms: 86400000
  async:
    use-kafka: ${USE_KAFKA:false}
  pricing:
    default-prompt-rate-per-1k: 0.005
    default-completion-rate-per-1k: 0.015
    models:
      gpt-4o:
        prompt: 0.005
        completion: 0.015
      gpt-4-turbo:
        prompt: 0.01
        completion: 0.03
      gpt-3.5-turbo:
        prompt: 0.0005
        completion: 0.0015
      claude-3-5-sonnet:
        prompt: 0.003
        completion: 0.015
      tracenixa-agent-model:
        prompt: 0.002
        completion: 0.006

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
